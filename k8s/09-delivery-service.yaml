apiVersion: apps/v1
kind: Deployment
metadata:
  name: burgeriam-delivery-service
  namespace: burgeriam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burgeriam-delivery-service
  template:
    metadata:
      labels:
        app: burgeriam-delivery-service
    spec:
      containers:
        - name: delivery-service
          image: cotters07/burgeriam-delivery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5096
              name: grpc
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5096"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              value: "Data Source=/app/data/delivery.db"
            - name: EventBus__ConnectionString
              value: "amqp://guest:guest@burgeriam-rabbitmq:5672"
            - name: EventBus__ExchangeName
              value: "burgeriam.exchange"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5096
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5096
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: delivery-service-data
---
apiVersion: v1
kind: Service
metadata:
  name: burgeriam-delivery-service
  namespace: burgeriam
spec:
  selector:
    app: burgeriam-delivery-service
  ports:
    - name: grpc
      port: 5096
      targetPort: 5096
  type: ClusterIP
