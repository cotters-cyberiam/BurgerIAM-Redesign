apiVersion: v1
kind: ConfigMap
metadata:
  name: wasm-frontend-nginx-config
  namespace: burgeriam
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include mime.types;
        default_type application/octet-stream;

        gzip on;
        gzip_types application/wasm application/octet-stream application/json text/plain;

        resolver kube-dns.kube-system.svc.cluster.local ipv6=off valid=10s;

        server {
            listen 80;
            root /usr/share/nginx/html;
            index index.html;

            location /api/ {
                set $gateway_api "http://burgeriam-api-gateway:5000";
                proxy_pass $gateway_api;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection keep-alive;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /grpc/ {
                set $gateway_grpc "http://burgeriam-api-gateway:5000";
                proxy_pass $gateway_grpc;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection keep-alive;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                add_header Access-Control-Allow-Origin *;
            }

            location / {
                try_files $uri $uri/ /index.html =404;
            }

            location ~* \.wasm$ {
                add_header Content-Type application/wasm;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location ~* \.br$ {
                add_header Content-Encoding br;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location ~* \.dll$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location ~* \.(blat|dat|pdb)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location ~* \.json$ {
                add_header Cache-Control "public, max-age=3600";
            }

            location ~* \.(css|js)$ {
                add_header Cache-Control "public, max-age=3600";
            }

            location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burgeriam-wasm-frontend
  namespace: burgeriam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burgeriam-wasm-frontend
  template:
    metadata:
      labels:
        app: burgeriam-wasm-frontend
    spec:
      containers:
        - name: wasm-frontend
          image: cotters07/burgeriam-wasm-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: wasm-frontend-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: burgeriam-wasm-frontend
  namespace: burgeriam
spec:
  selector:
    app: burgeriam-wasm-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: LoadBalancer
