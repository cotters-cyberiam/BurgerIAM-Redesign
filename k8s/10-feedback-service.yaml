apiVersion: apps/v1
kind: Deployment
metadata:
  name: burgeriam-feedback-service
  namespace: burgeriam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burgeriam-feedback-service
  template:
    metadata:
      labels:
        app: burgeriam-feedback-service
    spec:
      containers:
        - name: feedback-service
          image: burgeriam/feedback-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5007
              name: grpc
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5007"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              value: "Data Source=/app/data/feedback.db"
            - name: EventBus__ConnectionString
              value: "amqp://guest:guest@burgeriam-rabbitmq:5672"
            - name: EventBus__ExchangeName
              value: "burgeriam.exchange"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5007
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: feedback-service-data
---
apiVersion: v1
kind: Service
metadata:
  name: burgeriam-feedback-service
  namespace: burgeriam
spec:
  selector:
    app: burgeriam-feedback-service
  ports:
    - name: grpc
      port: 5007
      targetPort: 5007
  type: ClusterIP
