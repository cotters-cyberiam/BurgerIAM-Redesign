events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Brotli compressed assets (pre-compressed by Blazor publish)
    gzip on;
    gzip_types application/wasm application/octet-stream application/json text/plain;

    # Docker DNS resolver for runtime service discovery
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API requests to the API Gateway (variable forces runtime DNS resolution)
        location /api/ {
            set $gateway_api "http://burgeriam-api-gateway:5000";
            proxy_pass $gateway_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy gRPC-Web requests to the API Gateway
        location /grpc/ {
            set $gateway_grpc "http://burgeriam-api-gateway:5000";
            proxy_pass $gateway_grpc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
        }

        # Blazor WebAssembly static assets
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # WASM files
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Brotli compressed files
        location ~* \.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # DLL files
        location ~* \.dll$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Blazor framework files
        location ~* \.(blat|dat|pdb)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # JSON config files
        location ~* \.json$ {
            add_header Cache-Control "public, max-age=3600";
        }

        # CSS and JS
        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600";
        }

        # Images
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
