events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Brotli compressed assets (pre-compressed by Blazor publish)
    gzip on;
    gzip_types application/wasm application/octet-stream application/json text/plain;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Blazor WebAssembly static assets
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # WASM files
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Brotli compressed files
        location ~* \.br$ {
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # DLL files
        location ~* \.dll$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Blazor framework files
        location ~* \.(blat|dat|pdb)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # JSON config files
        location ~* \.json$ {
            add_header Cache-Control "public, max-age=3600";
        }

        # CSS and JS
        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600";
        }

        # Images
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
