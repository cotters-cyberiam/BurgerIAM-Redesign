<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d1a" />
    <meta name="description" content="BurgerIAM - Premium Fast Food Ordering System" />
    <title>BurgerIAM - Fast Food Ordering</title>
    <base href="/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css?v=2" rel="stylesheet" />
    <link href="WasmFrontend.styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="d-flex align-items-center justify-content-center vh-100" style="background: #0d0d1a;">
            <div class="text-center text-white">
                <div class="spinner-border text-danger mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                <h4 class="fw-bold" style="background: linear-gradient(135deg, #e63946, #f4a261); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">BurgerIAM</h4>
                <p style="color: rgba(255,255,255,0.5);">Loading deliciousness...</p>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Dismiss</a>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
