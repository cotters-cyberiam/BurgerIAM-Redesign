<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BurgerIAM - Fast Food Ordering</title>
    <base href="/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="WasmFrontend.styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="d-flex align-items-center justify-content-center vh-100" style="background: linear-gradient(135deg, #1d3557, #e63946);">
            <div class="text-center text-white">
                <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                <h4 class="fw-bold">BurgerIAM</h4>
                <p class="text-white-50">Loading deliciousness...</p>
            </div>
        </div>
    </div>

    <div id="floatingMsgContainer" class="floating-msg-container"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Dismiss</a>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
